# ==============================================================================
# AC ENGENHARIA - CYBERGRC & SGSI ENTERPRISE PLATFORM
# Configuração Nginx de Produção (Frontend SPA + Reverse Proxy API Backend)
# Hardened conforme ISO/IEC 27001 & OWASP Top 10
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Oculta versão do servidor Nginx (Prevenção de Fingerprinting)
    server_tokens off;

    # Limite de payload (compatível com o limite de 5MB da API)
    client_max_body_size 10M;

    # Compressão Gzip de alta performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Cabeçalhos de Segurança HTTP (OWASP / ISO 27001 A.8.26)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Diretório raiz dos artefatos compilados do Frontend (Vite)
    root /usr/share/nginx/html;
    index index.html;

    # Proxy Reverso para o Backend API (Express na porta 4301 + PostgreSQL 17)
    location /api/ {
        proxy_pass http://backend:4301/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache para assets estáticos com hash gerados pelo Vite em /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Arquivos de script e dados na raiz (sempre valida versão mais recente para evitar cache antigo)
    location ~* \.(?:css|js|mjs|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Fontes e Imagens
    location ~* \.(?:woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Roteamento SPA (Single Page Application)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
