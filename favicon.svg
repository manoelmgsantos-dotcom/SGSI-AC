<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071322" />
      <stop offset="50%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#0f2942" />
    </linearGradient>

    <!-- Outer Glow / Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0056b3" />
      <stop offset="40%" stop-color="#003e80" />
      <stop offset="100%" stop-color="#002147" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Gold / Amber Gradient for Security Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.4" />

  <!-- Background Cyber Circuit Grid Accent (Discreet) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 60 140 H 130 L 170 180 V 332 L 130 372 H 60" />
    <path d="M 452 140 H 382 L 342 180 V 332 L 382 372 H 452" />
    <circle cx="60" cy="140" r="4" fill="#38bdf8" />
    <circle cx="452" cy="140" r="4" fill="#38bdf8" />
    <circle cx="60" cy="372" r="4" fill="#38bdf8" />
    <circle cx="452" cy="372" r="4" fill="#38bdf8" />
  </g>

  <!-- Main Security Shield -->
  <g filter="url(#shadowFilter)">
    <path d="M 256 68 
             C 324 68, 386 86, 402 112 
             C 402 248, 344 366, 256 444 
             C 168 366, 110 248, 110 112 
             C 126 86, 188 68, 256 68 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#shieldBorder)" 
          stroke-width="5" />
  </g>

  <!-- Inner Shield Subtle Contour -->
  <path d="M 256 86 
           C 314 86, 368 102, 382 124 
           C 382 238, 332 344, 256 416 
           C 180 344, 130 238, 130 124 
           C 144 102, 198 86, 256 86 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="2" 
        opacity="0.35" />

  <!-- Monogram AC + Security Emblem -->
  <!-- Letter A -->
  <g font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
    <!-- 'AC' Monogram Styled -->
    <text x="256" y="246" font-size="142" font-weight="900" fill="#ffffff" letter-spacing="-4" filter="url(#shadowFilter)">
      AC
    </text>
  </g>

  <!-- Gold Security Lock & Checkmark Emblem beneath AC -->
  <g transform="translate(256, 320)" filter="url(#shadowFilter)">
    <!-- Shackle -->
    <path d="M -22 -14 V -30 C -22 -44, 22 -44, 22 -30 V -14" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />
    
    <!-- Lock Body -->
    <rect x="-34" y="-14" width="68" height="52" rx="12" fill="url(#goldGrad)" />
    
    <!-- Keyhole / Security Dot -->
    <circle cx="0" cy="6" r="6" fill="#071322" />
    <path d="M -3 10 L 3 10 L 4 22 L -4 22 Z" fill="#071322" />
  </g>

  <!-- SGSI Sub-banner Label -->
  <g transform="translate(256, 400)">
    <rect x="-56" y="-12" width="112" height="22" rx="6" fill="#071322" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="3" 
          font-family="system-ui, -apple-system, 'JetBrains Mono', 'Segoe UI', monospace" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#38bdf8" 
          text-anchor="middle">
      SGSI
    </text>
  </g>
</svg>