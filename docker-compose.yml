# ==============================================================================
# AC ENGENHARIA - CYBERGRC & SGSI ENTERPRISE PLATFORM
# DOCKER COMPOSE DE PRODUÇÃO PARA VPS (Frontend + Backend + PostgreSQL 17 + Adminer)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND WEB & PROXY REVERSO (NGINX ALPINE + VITE SPA)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cybergrc-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cybergrc-network

  # ----------------------------------------------------------------------------
  # 2. BACKEND API & MOTOR DE SEGURANÇA (NODE 20 ALPINE + EXPRESS)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybergrc-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3001"
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-cybergrc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cybergrc}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-cybergrc-ac-engenharia-secret-key-prod-2026}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_data:/app/server/data
    networks:
      - cybergrc-network

  # ----------------------------------------------------------------------------
  # 3. BANCO DE DADOS: POSTGRESQL 17 (PERSISTÊNCIA EM VOLUME ISOLADO)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: cybergrc-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybergrc}
      POSTGRES_USER: ${POSTGRES_USER:-cybergrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybergrc} -d ${POSTGRES_DB:-cybergrc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybergrc-network

  # ----------------------------------------------------------------------------
  # 4. GERENCIADOR VISUAL DO BANCO (ADMINER - ACESSO RESTRITO AO LOCALHOST/SSH)
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: cybergrc-adminer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    networks:
      - cybergrc-network

networks:
  cybergrc-network:
    name: cybergrc-enterprise-net
    driver: bridge

volumes:
  postgres_data:
    name: cybergrc-postgres-data
  backend_data:
    name: cybergrc-backend-data
